      <rect y="20" width="238" height="44" rx="10" fill="#F7C8D0"/><rect x="248" y="20" width="238" height="44" rx="10" fill="#F8D6A8"/><rect x="496" y="20" width="238" height="44" rx="10" fill="#FFF0B3"/><rect x="744" y="20" width="238" height="44" rx="10" fill="#BFE3D0"/><rect x="992" y="20" width="238" height="44" rx="10" fill="#BDD7EE"/>
