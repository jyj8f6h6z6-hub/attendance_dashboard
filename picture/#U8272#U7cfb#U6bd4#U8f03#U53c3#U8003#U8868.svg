      <text x="119" y="49" text-anchor="middle" class="hex white">#171717</text><text x="367" y="49" text-anchor="middle" class="hex white">#563A3A</text><text x="615" y="49" text-anchor="middle" class="hex white">#B08D57</text><text x="863" y="49" text-anchor="middle" class="hex">#E8DDC7</text><text x="1111" y="49" text-anchor="middle" class="hex">#F7F3EB</text>
