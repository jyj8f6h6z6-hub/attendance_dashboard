<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840">
  <rect width="1440" height="1840" fill="#F7F7F5"/>
  <style>
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#25282B}
    .title{font-size:54px;font-weight:700}.sub{font-size:23px;fill:#74797E}.name{font-size:30px;font-weight:700}
    .feel{font-size:19px;fill:#6B7075}.hex{font-size:16px;font-weight:600;fill:#25282B}.white{fill:#fff}.use{font-size:18px;fill:#4E5459}
  </style>
  <text x="90" y="105" class="title">10 組實用色系比較</text>
  <text x="90" y="148" class="sub">網站・圖表・簡報設計參考｜每組含 5 個可直接使用的 HEX 色碼</text>

